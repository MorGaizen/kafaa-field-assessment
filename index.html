<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Kafaa iFM Field Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: black brand bar, assessment list, then a two-zone workspace: score summary (radar + pillar bars) above a pillar-by-pillar question sheet */
:root{
  --red:#D82435; --red-ink:#B81D2C; --red-soft:#FBE5E7;
  --ink:#1F1F1F; --ink-2:#3F3F3F; --muted:#6E6E6E; --line:#DCDCDC; --surface:#F4F4F4; --card:#FFFFFF; --bg:#FFFFFF;
  --bar:#141414; --bar-fg:#FFFFFF;
  --ok:#1E8A4C; --warn:#C77700;
  --display:"Nexa Bold","Nexa","Montserrat",system-ui,sans-serif;
  --body:"Nexa","Montserrat",system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#E8424F; --red-ink:#FF6B76; --red-soft:#3A1A1D;
  --ink:#F2F2F2; --ink-2:#D0D0D0; --muted:#9A9A9A; --line:#333333; --surface:#1C1C1C; --card:#161616; --bg:#0F0F0F;
  --bar:#000000; --bar-fg:#FFFFFF; --ok:#3DBA72; --warn:#E89B2B; color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#E8424F; --red-ink:#FF6B76; --red-soft:#3A1A1D;
  --ink:#F2F2F2; --ink-2:#D0D0D0; --muted:#9A9A9A; --line:#333333; --surface:#1C1C1C; --card:#161616; --bg:#0F0F0F;
  --bar:#000000; --bar-fg:#FFFFFF; --ok:#3DBA72; --warn:#E89B2B; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;min-height:58px}
.logo{height:30px;width:auto;background:#fff;border-radius:3px;padding:3px 6px}
.apptitle{font-family:var(--display);font-weight:700;letter-spacing:.02em;font-size:15px;line-height:1.2;min-width:0}
.apptitle small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#BDBDBD}
.save{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;color:#D6D6D6}
.dot{width:8px;height:8px;border-radius:50%;background:#7a7a7a;flex:none}
.save[data-s="saved"] .dot{background:#3DBA72}.save[data-s="saving"] .dot{background:#E89B2B}.save[data-s="error"] .dot{background:#FF5A66}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(22px,4vw,30px);font-weight:800;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700}
.muted{color:var(--muted)}
button{font-family:inherit;font-size:14px;cursor:pointer;border-radius:var(--r)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.btn{background:var(--red);color:#fff;border:0;padding:10px 16px;font-weight:700}
.btn:hover{background:var(--red-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{border-color:var(--ink-2)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.banner{border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:var(--r);margin-bottom:16px;font-size:14px}
.banner.err{border-color:var(--red);background:var(--red-soft)}
/* list */
.listhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;text-align:left;color:var(--ink);width:100%}
.acard:hover{border-color:var(--ink-2)}
.acard h3{font-size:16px;font-weight:700;grid-column:1}
.acard .meta{grid-column:1;font-size:13px;color:var(--muted)}
.acard .big{grid-column:2;grid-row:1/span 3;align-self:center;text-align:right}
.score{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;font-variant-numeric:tabular-nums;color:var(--red)}
.score.na{color:var(--muted)}
.prog{grid-column:1/-1;height:4px;background:var(--surface);border-radius:2px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ink)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center}
.empty p{max-width:52ch;margin:8px auto 16px}
/* form */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px;margin-top:14px}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.formactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
/* workspace */
.back{background:none;border:0;color:var(--muted);padding:0;font-weight:600;margin-bottom:10px}
.back:hover{color:var(--ink)}
.whead{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.whead .info{min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-2);background:var(--card)}
.summary{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:760px){.summary{grid-template-columns:minmax(0,1fr)}}
.radarbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.radarbox svg{width:100%;height:auto;display:block}
.overall{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.overall .score{font-size:56px}
.band{font-family:var(--display);font-weight:700;font-size:15px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:3px;background:var(--red);display:inline-block}
.sw.t{background:none;border-top:2px dashed var(--muted);height:0}
.bars{display:grid;gap:8px;margin-top:14px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;font-size:13px;background:none;border:0;padding:4px 0;color:var(--ink);text-align:left}
.barrow:hover .bn{color:var(--red)}
.barrow .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:8px;background:var(--surface);border-radius:4px;position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--red);border-radius:4px}
.barrow b{font-variant-numeric:tabular-nums;text-align:right}
.flagnote{margin-top:12px;font-size:13px;color:var(--warn);font-weight:600}
/* pillar tabs */
.ptabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin-top:22px;scrollbar-width:thin}
.ptab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;text-align:left;min-width:132px}
.ptab .n{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.ptab .t{display:block;font-weight:700;font-size:13px;line-height:1.25;margin-top:2px}
.ptab .s{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.ptab[aria-selected="true"]{background:var(--bar);color:#fff;border-color:var(--bar)}
.ptab[aria-selected="true"] .n,.ptab[aria-selected="true"] .s{color:#C9C9C9}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end;margin:10px 0 12px}
.phead p{margin:4px 0 0;max-width:70ch;font-size:14px;color:var(--ink-2)}
.qlist{display:grid;gap:12px}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.q.flag{border-color:var(--warn)}
.qtop{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.qn{font-family:var(--display);font-weight:800;color:var(--red);font-size:14px;min-width:30px;font-variant-numeric:tabular-nums}
.qt{font-weight:600}
.src{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:1px}
.scale{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 2px;display:grid;justify-items:center;line-height:1.15}
.chip b{font-size:16px;font-family:var(--display)}
.chip span{font-size:10px;color:var(--muted);letter-spacing:.02em}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip[aria-pressed="true"] span{color:#FFE3E5}
.chip.na[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2)}
.chip:disabled{cursor:not-allowed;opacity:.6}
.self{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.self .mini{border:1px solid var(--line);background:var(--bg);color:var(--ink-2);width:30px;height:28px;padding:0;font-size:12px;font-weight:700}
.self .mini[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.evid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph{position:relative;width:84px;height:84px;border-radius:4px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:24px;padding:0}
.ph .busy{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.addph{width:84px;height:84px;border:1px dashed var(--ink-2);background:transparent;color:var(--ink-2);font-size:12px;font-weight:600;display:grid;place-items:center;text-align:center;padding:4px}
.addph:hover{border-color:var(--red);color:var(--red)}
.evflag{font-size:12px;font-weight:700;color:var(--warn)}
.pnote{margin-top:14px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20;padding:16px}
.dlg .panel{max-width:420px;width:100%}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:30;display:grid;place-items:center;padding:16px}
.viewer img{max-height:88vh;max-width:100%;border-radius:4px}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.foot{margin-top:28px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.rubric{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-top:10px;font-size:12px}
.rubric div{background:var(--surface);border-radius:4px;padding:6px 8px}
.rubric b{color:var(--red)}
@media (max-width:560px){.apptitle small{display:none}.apptitle{font-size:14px}.logo{height:26px}#savetxt{max-width:96px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}header.top .wrap{gap:10px}}
@media (prefers-reduced-motion:no-preference){.track i,.prog i{transition:width .35s ease}}
</style>

</head>

/* ---------- scoring ---------- */
function pillarScore(k,src){
  const a=(src||answers)[k]; if(!a||!a.items) return {kafaa:null,tbc:null,done:0,flags:0};
  let s=0,n=0,ts=0,tn=0,done=0,flags=0;
  const P=PILLARS.find(p=>p.k===k);
  P.q.forEach((_,i)=>{const it=a.items[i]; if(!it) return;
    if(it.score==="NA"){done++;}
    else if(typeof it.score==="number"){s+=it.score;n++;done++;
      if(it.score>3 && !(it.photos&&it.photos.length) && !(it.note&&it.note.trim())) flags++;}
    if(typeof it.tbc==="number"){ts+=it.tbc;tn++}
  });
  return {kafaa:n?s/n:null,tbc:tn?ts/tn:null,done,flags};
}
function overall(src){
  const v=PILLARS.map(p=>pillarScore(p.k,src).kafaa).filter(x=>x!=null);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}
const band=x=>x==null?"Not scored":LEVELS[Math.min(5,Math.max(0,Math.round(x)-1))];
const fmt=x=>x==null?"-":x.toFixed(2);

/* ---------- radar ---------- */
function radar(){
  const W=420,H=380,cx=W/2,cy=H/2+4,R=128,N=PILLARS.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(a)*R*v/6, cy+Math.sin(a)*R*v/6]};
  let g="";
  for(let r=1;r<=6;r++){const pts=PILLARS.map((_,i)=>pt(i,r).join(",")).join(" ");
    g+=`<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="${r===6?1.4:1}"/>`;
    g+=`<text x="${cx+3}" y="${cy-R*r/6+3}" font-size="9" fill="var(--muted)">${r}</text>`}
  PILLARS.forEach((p,i)=>{const [x,y]=pt(i,6);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const [lx,ly]=pt(i,7.35);const anc=Math.abs(lx-cx)<8?"middle":(lx>cx?"start":"end");
    const words=p.t.replace("&","and").split(" ");let lines=[],l="";words.forEach(w=>{if((l+" "+w).trim().length>14){lines.push(l.trim());l=w}else l+=" "+w});lines.push(l.trim());
    const sc=pillarScore(p.k).kafaa;
    g+=`<text x="${lx}" y="${ly-(lines.length-1)*6}" text-anchor="${anc}" font-size="10.5" font-weight="600" fill="var(--ink-2)">${lines.map((t,j)=>`<tspan x="${lx}" dy="${j?12:0}">${esc(t)}</tspan>`).join("")}<tspan x="${lx}" dy="13" font-weight="800" fill="var(--red)">${fmt(sc)}</tspan></text>`});
  const poly=key=>{const vals=PILLARS.map(p=>pillarScore(p.k)[key]);if(vals.every(v=>v==null))return"";
    return PILLARS.map((p,i)=>pt(i,vals[i]??0).join(",")).join(" ")};
  const t=poly("tbc"),k=poly("kafaa");
  if(t) g+=`<polygon points="${t}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  if(k){g+=`<polygon points="${k}" fill="var(--red)" fill-opacity=".16" stroke="var(--red)" stroke-width="2.2"/>`;
    PILLARS.forEach((p,i)=>{const v=pillarScore(p.k).kafaa;if(v!=null){const [x,y]=pt(i,v);g+=`<circle cx="${x}" cy="${y}" r="3.5" fill="var(--red)"/>`}})}
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar chart of the eight pillar scores">${g}</svg>`;
}

   <p class="muted" style="margin:4px 0 0">${TOTALQ} statements across 8 pillars, scored 1 to 6 with photo and note evidence. Everything saves to the cloud as you go.</p></div>
   <button class="btn" id="newBtn" ${(!db||!canWrite)?"disabled":""}>New site assessment</button></div>`;
  if(!listLoaded&&db) return h+`<div class="empty"><p class="muted">Loading assessments...</p></div>`;
  if(!list.length) return h+`<div class="empty"><h2>No site assessments yet</h2><p class="muted">Start with the school you are visiting. Enter its details, then score each pillar, add notes and take photos as evidence. The radar and overall score build up as you go.</p>${db&&canWrite?'<button class="btn" id="newBtn2">Start the first assessment</button>':""}</div>`;
  h+=`<div class="cards">`+list.map(a=>{const s=a.summary||{};const o=s.overall;const pct=Math.round(100*(s.answered||0)/TOTALQ);
    return `<button class="acard" data-open="${esc(a.id)}"><h3>${esc(a.school||"Unnamed site")}</h3>
     <div class="meta">${esc([a.region,a.zone,a.contract].filter(Boolean).join(" · "))}</div>
     <div class="meta">${esc(a.visitDate||"")} ${a.assessorName?"· "+esc(a.assessorName):""}</div>
     <div class="big"><div class="score ${o==null?"na":""}">${fmt(o)}</div><div class="muted" style="font-size:12px">${esc(band(o))}</div></div>
     <div class="prog" title="${pct}% answered"><i style="width:${pct}%"></i></div></button>`}).join("")+`</div>`;
  return h+foot();
}
function foot(){return `<div class="foot">Scale: <div class="rubric">${LEVELS.map((l,i)=>`<div><b>${i+1}</b> ${l}</div>`).join("")}</div><p style="margin:10px 0 0">Evidence rule: a Kafaa score above 3 needs a photo or a note. Source tags show where the evidence normally comes from: DOC (document review), FIELD (site observation), INTERVIEW.</p></div>`}
function newView(){
  const a=view==="new"&&curEdit?curEdit:{};
  return `${banner()}<button class="back" id="backList">&larr; All assessments</button>
  <div class="panel"><div class="eyebrow">${a.id?"Edit site details":"New site assessment"}</div><h1>${a.id?esc(a.school):"Which school are you assessing?"}</h1>
  <form id="newForm"><div class="formgrid">
   <label class="f">School name<input id="f_school" required value="${esc(a.school)}" placeholder="e.g. Prince AbdulMajeed Secondary School"></label>
   <label class="f">Building or site code<input id="f_code" value="${esc(a.code)}"></label>
   <label class="f">Region<select id="f_region">${REGIONS.map(r=>`<option ${a.region===r?"selected":""}>${r}</option>`).join("")}</select></label>
   <label class="f">Zone<input id="f_zone" value="${esc(a.zone)}" placeholder="e.g. Riyadh Zone 3"></label>
   <label class="f">iFM contract / contractor<input id="f_contract" value="${esc(a.contract)}" placeholder="e.g. Framework #120 - Shalfa"></label>
   <label class="f">School stage<select id="f_stage">${STAGES.map(r=>`<option ${a.stage===r?"selected":""}>${r}</option>`).join("")}</select></label>
   <label class="f">Visit date<input id="f_date" type="date" value="${esc(a.visitDate||new Date().toISOString().slice(0,10))}"></label>
   <label class="f">Kafaa assessor<input id="f_assessor" value="${esc(a.assessorName||myName)}"></label>
   <label class="f">TBC representative<input id="f_tbc" value="${esc(a.tbcRep)}"></label>
  </div>
  <label class="f" style="margin-top:12px">Visit notes<textarea id="f_notes">${esc(a.notes)}</textarea></label>
  <div class="formactions"><button class="btn" type="submit" id="f_submit">${a.id?"Save details":"Create and start scoring"}</button><button class="btn ghost" type="button" id="cancelNew">Cancel</button></div>
  <p id="f_err" class="muted" role="alert"></p></form></div>`;
}
let curEdit=null, myName="";
function workView(){
  if(!curDoc) return `${banner()}<button class="back" id="backList">&larr; All assessments</button><div class="empty"><p class="muted">Loading assessment...</p></div>`;
  const a=curDoc, o=overall(); let flags=0, done=0;
  PILLARS.forEach(p=>{const s=pillarScore(p.k);flags+=s.flags;done+=s.done});
  const P=PILLARS.find(p=>p.k===tab), A=(answers[tab]&&answers[tab].items)||{};
  let h=`${banner()}<button class="back" id="backList">&larr; All assessments</button>
  <div class="whead"><div class="info"><div class="eyebrow">Site assessment</div><h1>${esc(a.school)}</h1>
   <div class="tags">${[a.code,a.region,a.zone,a.contract,a.stage,a.visitDate,a.assessorName&&("Assessor: "+a.assessorName),a.tbcRep&&("TBC: "+a.tbcRep)].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost small" id="editSite" ${canWrite?"":"disabled"}>Edit details</button><button class="btn ghost small" id="delSite" ${canWrite?"":"disabled"}>Delete</button></div></div>
  <section class="summary">
   <div class="radarbox">${radar()}<div class="legend"><span><i class="sw"></i>Kafaa validated score</span><span><i class="sw t"></i>TBC self-score</span></div></div>
   <div class="panel"><div class="eyebrow">Overall maturity</div>
    <div class="overall"><div class="score ${o==null?"na":""}">${fmt(o)}</div><div><div class="band">${esc(band(o))}</div><div class="muted" style="font-size:13px">out of 6 · ${done} of ${TOTALQ} statements answered</div></div></div>
    <div class="bars">${PILLARS.map(p=>{const s=pillarScore(p.k);return `<button class="barrow" data-tab="${p.k}"><span class="bn">${esc(p.t)}</span><span class="track"><i style="width:${s.kafaa?s.kafaa/6*100:0}%"></i></span><b>${fmt(s.kafaa)}</b></button>`}).join("")}</div>
    ${flags?`<div class="flagnote">${flags} score${flags>1?"s above 3 still need":" above 3 still needs"} a photo or note as evidence.</div>`:""}
   </div></section>
  <nav class="ptabs" role="tablist" aria-label="Pillars">${PILLARS.map((p,i)=>{const s=pillarScore(p.k);return `<button class="ptab" role="tab" aria-selected="${p.k===tab}" data-tab="${p.k}"><span class="n">PILLAR ${i+1}</span><span class="t">${esc(p.t)}</span><span class="s">${s.done}/${p.q.length} · ${fmt(s.kafaa)}</span></button>`}).join("")}</nav>
  <div class="phead"><div><h2>${esc(P.t)}</h2><p>${esc(P.d)}</p></div><div class="muted" style="font-size:13px">Pillar score <b style="color:var(--red);font-size:18px">${fmt(pillarScore(tab).kafaa)}</b></div></div>
  <div class="qlist">${P.q.map((q,i)=>qCard(P,q,i,A[i]||{})).join("")}</div>
  <label class="f pnote">Pillar observations<textarea id="pnote" data-k="${tab}" placeholder="Overall comments for this pillar" ${canWrite?"":"disabled"}>${esc((answers[tab]&&answers[tab].note)||"")}</textarea></label>
  <div style="display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap">
   ${PILLARS.findIndex(p=>p.k===tab)>0?`<button class="btn ghost" data-tab="${PILLARS[PILLARS.findIndex(p=>p.k===tab)-1].k}">&larr; Previous pillar</button>`:"<span></span>"}
   ${PILLARS.findIndex(p=>p.k===tab)<7?`<button class="btn" data-tab="${PILLARS[PILLARS.findIndex(p=>p.k===tab)+1].k}">Next pillar &rarr;</button>`:""}</div>`;
  return h+foot();
}
function qCard(P,q,i,it){
  const sc=it.score, flag=typeof sc==="number"&&sc>3&&!(it.photos&&it.photos.length)&&!(it.note&&it.note.trim());
  const dis=canWrite?"":"disabled";
  return `<div class="q ${flag?"flag":""}" id="q_${P.k}_${i}"><div class="qtop"><div class="qn">${P.k}${i+1}</div><div class="qt">${esc(q[0])}<span class="src">${SRC[q[1]]}</span></div></div>
   <div class="scale" role="group" aria-label="Kafaa score">${LEVELS.map((l,j)=>`<button class="chip" ${dis} aria-pressed="${sc===j+1}" data-score="${j+1}" data-q="${i}"><b>${j+1}</b><span>${l}</span></button>`).join("")}<button class="chip na" ${dis} aria-pressed="${sc==="NA"}" data-score="NA" data-q="${i}"><b>N/A</b><span>Not applicable</span></button></div>
   <div class="self">TBC self-score:${[1,2,3,4,5,6].map(n=>`<button class="mini" ${dis} aria-pressed="${it.tbc===n}" data-tbc="${n}" data-q="${i}">${n}</button>`).join("")}</div>
   <div class="evid"><textarea class="qnote" data-q="${i}" placeholder="Evidence note: what you saw, document reference, who said it" ${dis}>${esc(it.note||"")}</textarea>
    <div class="photos">${(it.photos||[]).map(id=>`<div class="ph">${photoUrl[id]?`<img src="${esc(photoUrl[id])}" alt="Evidence photo for ${P.k}${i+1}" loading="lazy" data-view="${esc(id)}">`:`<span class="busy">Loading</span>`}${canWrite?`<button aria-label="Remove photo" data-rmph="${esc(id)}" data-q="${i}">&times;</button>`:""}</div>`).join("")}
     ${(uploading[P.k+"_"+i]||0)>0?`<div class="ph"><span class="busy">Uploading...</span></div>`:""}
     ${canWrite?`<button class="addph" data-addph="${i}">+ Photo</button>`:""}
     ${flag?`<span class="evflag">Add a photo or note to support this score</span>`:""}</div></div></div>`;
}
const uploading={};

/* ---------- data (Supabase) ---------- */
function itemsFor(k){ if(!answers[k]) answers[k]={items:{},note:""}; if(!answers[k].items) answers[k].items={}; return answers[k]; }
function markDirty(k){
  dirty[k]=true; const pend=loadPending(); pend[cur]=pend[cur]||{}; pend[cur][k]=answers[k]; savePending(pend);
  setSave("saving","Saving"); clearTimeout(timers[k]); timers[k]=setTimeout(()=>flush(k),700);
}
async function sbDo(q){ const r=await q; if(r.error) throw r.error; return r.data }
async function flush(k){
  if(!sb||!cur) return; const aid=cur; const body=JSON.parse(JSON.stringify(answers[k]));
  inflight++;
  try{ await sbDo(sb.from("answers").upsert({assessment_id:aid,pillar:k,body,updated_at:new Date().toISOString()}));
    if(cur===aid) dirty[k]=false;
    const pend=loadPending(); if(pend[aid]){delete pend[aid][k]; if(!Object.keys(pend[aid]).length) delete pend[aid]; savePending(pend)}
    await updateSummary(aid);
  }catch(e){ console.warn(e); setSave("error","Not saved, kept on this device"); inflight--; return }
  inflight--; if(!inflight&&!Object.values(dirty).some(Boolean)) setSave("saved","All changes saved to cloud");
}
async function updateSummary(aid){
  const pillars={}; let answered=0; PILLARS.forEach(p=>{const s=pillarScore(p.k);pillars[p.k]=s.kafaa;answered+=s.done});
  const summary={overall:overall(),pillars,answered};
  try{ await sbDo(sb.from("assessments").update({summary,updated_at:new Date().toISOString()}).eq("id",aid)); if(curDoc&&cur===aid) curDoc.summary=summary }catch(e){}
}
async function flushPending(){
  const pend=loadPending(); const ids=Object.keys(pend); if(!ids.length||!sb) return;
  setSave("saving","Uploading saved offline changes");
  for(const aid of ids){ for(const k of Object.keys(pend[aid])){
    try{ await sbDo(sb.from("answers").upsert({assessment_id:aid,pillar:k,body:pend[aid][k],updated_at:new Date().toISOString()}));
      const p2=loadPending(); if(p2[aid]){delete p2[aid][k]; if(!Object.keys(p2[aid]).length) delete p2[aid]; savePending(p2)} }catch(e){ setSave("error","Offline changes still waiting"); return } } }
  setSave("saved","All changes saved to cloud");
}
const rowToDoc=r=>({id:r.id,...(r.info||{}),summary:r.summary||{},updatedAt:r.updated_at});
async function loadList(){
  try{ const rows=await sbDo(sb.from("assessments").select("id,info,summary,updated_at").order("updated_at",{ascending:false}));
    list=rows.map(rowToDoc); listLoaded=true; if(view==="list") render(); }catch(e){ setSave("error","Could not load assessments") }
}
async function openAssessment(id){
  cur=id; curDoc=null; answers={}; tab="AC"; view="work";
  try{localStorage.setItem("kafaa-fa-last",id)}catch(e){}
  render(); window.scrollTo(0,0);
  try{
    const row=await sbDo(sb.from("assessments").select("id,info,summary,updated_at").eq("id",id).maybeSingle());
    if(!row){ view="list"; cur=null; try{localStorage.removeItem("kafaa-fa-last")}catch(_){}; render(); return }
    const ans=await sbDo(sb.from("answers").select("pillar,body").eq("assessment_id",id));
    if(cur!==id) return;
    curDoc=rowToDoc(row); const pend=(loadPending()[id])||{};
    ans.forEach(a=>{answers[a.pillar]=pend[a.pillar]||a.body}); Object.keys(pend).forEach(k=>{if(!answers[k]) answers[k]=pend[k]});
    render(); refreshPhotoUrls();
  }catch(e){ setSave("error","Could not load this assessment") }
}
function renderKeepFocus(){
  const a=document.activeElement; if(a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT")) { softRefresh(); return }
  const y=window.scrollY; render(); window.scrollTo(0,y);
}
function softRefresh(){
  const app=$("#app"); const tmp=document.createElement("div"); tmp.innerHTML=workView();
  const ns=tmp.querySelector(".summary"), os=app.querySelector(".summary"); if(ns&&os) os.replaceWith(ns);
  const nt=tmp.querySelector(".ptabs"), ot=app.querySelector(".ptabs"); if(nt&&ot) ot.replaceWith(nt);
}
const photoUrl={};
async function refreshPhotoUrls(){
  const paths=[]; Object.values(answers).forEach(a=>Object.values((a&&a.items)||{}).forEach(it=>(it.photos||[]).forEach(p=>{if(!photoUrl[p]) paths.push(p)})));
  if(!paths.length) return;
  try{ const r=await sbDo(sb.storage.from(BUCKET).createSignedUrls(paths,60*60*12)); r.forEach(x=>{ if(x.signedUrl) photoUrl[x.path]=x.signedUrl }); renderKeepFocus() }catch(e){}
}

/* ---------- photos ---------- */
async function compress(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try{ const bmp=await createImageBitmap(file); const m=1600, sc=Math.min(1,m/Math.max(bmp.width,bmp.height));
    if(sc===1&&file.size<1.5e6) return file;
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.82));
  }catch(e){ return file }
}
let photoTarget=null;
$("#fileIn").addEventListener("change",async ev=>{
  const files=[...ev.target.files]; ev.target.value=""; if(!photoTarget||!sb) return;
  const {k,i,aid}=photoTarget; const key=k+"_"+i;
  for(const f of files){
    uploading[key]=(uploading[key]||0)+1; renderKeepFocus(); setSave("saving","Uploading photo");
    try{ const blob=await compress(f); const ext=(blob.type||"image/jpeg").split("/")[1].replace("jpeg","jpg");
      const path=`${aid}/${k}${i+1}_${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
      await sbDo(sb.storage.from(BUCKET).upload(path,blob,{contentType:blob.type||"image/jpeg",upsert:false}));
      if(cur===aid){ const A=itemsFor(k); A.items[i]=A.items[i]||{}; A.items[i].photos=[...(A.items[i].photos||[]),path]; markDirty(k); }
      photoUrl[path]=URL.createObjectURL(blob);
    }catch(e){ console.warn(e); setSave("error","Photo could not be uploaded. Use JPEG or PNG and check your connection.") }
    uploading[key]--; renderKeepFocus();
  }
});

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,img[data-view]"); if(!t) return;
  if(t.id==="newBtn"||t.id==="newBtn2"){curEdit=null;view="new";render();$("#f_school")?.focus();return}
  if(t.id==="backList"){cur=null;curDoc=null;view="list";try{localStorage.removeItem("kafaa-fa-last")}catch(_){};render();loadList();return}
  if(t.id==="signOut"){await sb.auth.signOut();location.reload();return}
  if(t.id==="cancelNew"){view=curEdit&&curEdit.id?"work":"list";render();return}
  if(t.dataset.open){openAssessment(t.dataset.open);return}
  if(t.id==="editSite"){curEdit=curDoc;view="new";render();return}
  if(t.id==="delSite"){confirmDelete();return}
  if(t.dataset.tab){tab=t.dataset.tab;const y=$(".ptabs")?.getBoundingClientRect().top+window.scrollY-70;render();if(t.classList.contains("barrow")||t.classList.contains("btn"))window.scrollTo(0,y);return}
  if(t.dataset.score&&canWrite){const i=+t.dataset.q;const A=itemsFor(tab);A.items[i]=A.items[i]||{};
    const v=t.dataset.score==="NA"?"NA":+t.dataset.score; A.items[i].score=(A.items[i].score===v)?null:v; markDirty(tab);
    const y=window.scrollY; render(); window.scrollTo(0,y); return}
  if(t.dataset.tbc&&canWrite){const i=+t.dataset.q;const A=itemsFor(tab);A.items[i]=A.items[i]||{};
    const v=+t.dataset.tbc; A.items[i].tbc=(A.items[i].tbc===v)?null:v; markDirty(tab); const y=window.scrollY; render(); window.scrollTo(0,y); return}
  if(t.dataset.addph!=null){photoTarget={k:tab,i:+t.dataset.addph,aid:cur};$("#fileIn").click();return}
  if(t.dataset.rmph){const i=+t.dataset.q, id=t.dataset.rmph;const A=itemsFor(tab);
    A.items[i].photos=(A.items[i].photos||[]).filter(x=>x!==id); markDirty(tab); renderKeepFocus();
    try{await sb.storage.from(BUCKET).remove([id])}catch(_){} return}
  if(t.dataset.view){const v=document.createElement("div");v.className="viewer";v.innerHTML=`<img src="${esc(photoUrl[t.dataset.view]||"")}" alt="Evidence photo"><button class="btn small">Close</button>`;v.addEventListener("click",()=>v.remove());document.body.appendChild(v);return}
});
document.addEventListener("input",e=>{
  const t=e.target; if(!canWrite) return;
  if(t.classList.contains("qnote")){const i=+t.dataset.q;const A=itemsFor(tab);A.items[i]=A.items[i]||{};A.items[i].note=t.value;markDirty(tab);
    const card=t.closest(".q"); const it=A.items[i]; const flag=typeof it.score==="number"&&it.score>3&&!(it.photos&&it.photos.length)&&!(it.note&&it.note.trim()); card.classList.toggle("flag",flag); const ef=card.querySelector(".evflag"); if(ef&&!flag) ef.remove(); return}
  if(t.id==="pnote"){const A=itemsFor(t.dataset.k);A.note=t.value;markDirty(t.dataset.k)}
});
document.addEventListener("focusout",e=>{ if(e.target.classList&&(e.target.classList.contains("qnote")||e.target.id==="pnote")) setTimeout(()=>{ if(view==="work"&&!(document.activeElement&&document.activeElement.tagName==="TEXTAREA")) softRefresh() },50) });
document.addEventListener("submit",async e=>{
  if(e.target.id==="loginForm"){ e.preventDefault(); const em=$("#l_email").value.trim(), pw=$("#l_pw").value;
    $("#l_btn").disabled=true; const r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){ $("#l_err").textContent="Sign-in failed. Check the email and password your administrator gave you."; $("#l_btn").disabled=false; return }
    session=r.data.session; startApp(); return }
  if(e.target.id!=="newForm") return; e.preventDefault(); if(!sb) return;
  const v=id=>$("#"+id).value.trim(); const info={school:v("f_school"),code:v("f_code"),region:v("f_region"),zone:v("f_zone"),contract:v("f_contract"),stage:v("f_stage"),visitDate:v("f_date"),assessorName:v("f_assessor"),tbcRep:v("f_tbc"),notes:v("f_notes")};
  if(!info.school){$("#f_err").textContent="Enter the school name.";return}
  $("#f_submit").disabled=true; setSave("saving","Saving site");
  try{
    if(curEdit&&curEdit.id){ await sbDo(sb.from("assessments").update({info,updated_at:new Date().toISOString()}).eq("id",curEdit.id)); Object.assign(curDoc,info); setSave("saved","All changes saved to cloud"); view="work"; render() }
    else { const row=await sbDo(sb.from("assessments").insert({info,summary:{overall:null,pillars:{},answered:0}}).select("id").single());
      setSave("saved","All changes saved to cloud"); openAssessment(row.id) }
  }catch(err){ $("#f_err").textContent="Could not save. Check your connection and try again."; $("#f_submit").disabled=false; setSave("error","Not saved") }
});
function confirmDelete(){
  const d=document.createElement("div");d.className="dlg";d.innerHTML=`<div class="panel" role="dialog" aria-modal="true"><h2>Delete this assessment?</h2><p class="muted">${esc(curDoc.school)} and all its scores and notes will be removed for everyone. This cannot be undone.</p><div class="formactions"><button class="btn" id="dYes">Delete assessment</button><button class="btn ghost" id="dNo">Keep it</button></div></div>`;
  document.body.appendChild(d); d.querySelector("#dNo").onclick=()=>d.remove();
  d.querySelector("#dYes").onclick=async()=>{ const id=cur; d.remove(); try{ await sbDo(sb.from("assessments").delete().eq("id",id)) }catch(e){ setSave("error","Could not delete") } cur=null;view="list";try{localStorage.removeItem("kafaa-fa-last")}catch(_){};render();loadList() };
}
window.addEventListener("online",()=>{if(sb)flushPending()});
window.addEventListener("beforeunload",e=>{ if(Object.values(dirty).some(Boolean)){ e.preventDefault(); e.returnValue="" } });

/* ---------- boot ---------- */
async function startApp(){
  canWrite=true; db=true; setSave("saved","Connected to cloud");
  const u=session&&session.user; myName=(u&&u.email)||"";
  render(); await loadList(); flushPending();
  let last=null; try{last=localStorage.getItem("kafaa-fa-last")}catch(e){}
  if(last) openAssessment(last);
}
function loginView(){
  $("#app").innerHTML=`<div class="panel" style="max-width:420px;margin:24px auto"><div class="eyebrow">Kafaa Efficiency Excellence</div><h1>Sign in</h1>
  <p class="muted">Use the email and password your Kafaa administrator created for you.</p>
  <form id="loginForm" class="formgrid" style="grid-template-columns:1fr"><label class="f">Email<input id="l_email" type="email" autocomplete="username" required></label>
  <label class="f">Password<input id="l_pw" type="password" autocomplete="current-password" required></label>
  <button class="btn" id="l_btn" type="submit">Sign in</button><p id="l_err" class="muted" role="alert"></p></form></div>`;
}
render();
(async()=>{
  if(!SUPABASE_URL.startsWith("https://")||!window.supabase){ $("#app").innerHTML=`<div class="banner err"><b>Setup needed.</b> Paste your Supabase Project URL and anon key into the two lines at the top of the script in index.html.</div>`; setSave("error","Not configured"); return }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const r=await sb.auth.getSession(); session=r.data.session;
  if(!session){ setSave("idle","Signed out"); loginView(); return }
  startApp();
})();
</script>
